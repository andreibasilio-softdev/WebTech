<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration Form</title>
</head>
<body>
  <h1>Student Registration</h1>

  <form action="#" method="post">

    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" placeholder="e.g. Juan Dela Cruz" required minlength="2" maxlength="50">
    <br><br>

    <label for="studentid">Student ID:</label>
    <input type="text" id="studentid" name="studentid" placeholder="e.g. 24-5436-534" required minlength="8" maxlength="12">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="e.g. akolangto@gmail" required maxlength="60">
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" maxlength="20">
    <br><br>

    <label for="birthday">Birthday:</label>
    <input type="date" id="birthday" name="birthday" required>
    <br><br>

    <p>Gender:</p>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>
    <input type="radio" id="other" name="gender" value="other">
    <label for="other">Other</label>
    <br><br>

    <label for="program">Program:</label>
    <select id="program" name="program" required>
      <option value="">-- Select Program --</option>
      <option value="bsit">BS Information Technology</option>
      <option value="bscs">BS Computer Science</option>
      <option value="bsis">BS Information Systems</option>
    </select>
    <br><br>

    <p>Hobbies:</p>
    <input type="checkbox" id="coding" name="hobbies" value="coding">
    <label for="coding">Coding</label>
    <input type="checkbox" id="gaming" name="hobbies" value="gaming">
    <label for="gaming">Gaming</label>
    <input type="checkbox" id="music" name="hobbies" value="music">
    <label for="music">Music</label>
    <input type="checkbox" id="sports" name="hobbies" value="sports">
    <label for="sports">Sports</label>
    <br><br>

    <label for="address">Address:</label><br>
    <textarea id="address" name="address" rows="3" cols="40" placeholder="House No., Street, City" required minlength="10" maxlength="150"></textarea>
    <br><br>

    <label for="comments">Comments:</label><br>
    <textarea id="comments" name="comments" rows="4" cols="40" placeholder="Any additional comments (optional)" maxlength="200"></textarea>
    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>
</body>
</html>
